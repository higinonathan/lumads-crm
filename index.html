  <script>
    (() => {
      try {
        const preference = localStorage.getItem('lumads-theme-preference') || 'system';
        const resolved = preference === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
      } catch (_) { document.documentElement.dataset.theme = 'light'; }
    })();

    function approvalRows(records){return records.map(a=>`<tr><td>${clientCell(a)}</td><td><div class="content-title">${a.content}</div><div class="content-type">${a.type}</div></td><td class="date-cell">${a.sent}</td><td class="deadline ${a.late?'late':''}">${a.deadline}</td><td>${badge(a)}</td><td class="next-action">${a.next}</td><td><div class="compact-actions"><button class="text-action primary-action" data-action="Abrir aprovação">Abrir</button><button class="text-action" data-action="WhatsApp">WhatsApp</button><button class="text-action" data-action="Aprovado">Aprovar</button><button class="text-action" data-action="Mais opções">•••</button></div></td></tr>`).join('');}
    function renderApprovals(){
      dynamicContent.innerHTML=`<section class="metrics page-content"><div class="metric"><div class="metric-label">Em acompanhamento</div><div class="metric-line"><strong class="metric-value">24</strong><span class="mini blue">◷</span></div></div><div class="metric"><div class="metric-label">Pendentes hoje</div><div class="metric-line"><strong class="metric-value">5</strong><span class="mini yellow">!</span></div></div><div class="metric"><div class="metric-label">Atrasadas</div><div class="metric-line"><strong class="metric-value">2</strong><span class="mini pink">!</span></div></div></section><section class="page-section"><div class="page-intro"><div><h2>Lista completa de aprovações</h2><p>Todos os conteúdos ativos no acompanhamento.</p></div></div><div class="filter-panel"><input id="approvalSearch" class="search-input" placeholder="Buscar cliente ou conteúdo"/><select id="statusFilter" class="filter-select"><option value="">Todos os status</option>${[...new Set(approvals.map(a=>a.status))].map(s=>`<option>${s}</option>`).join('')}</select><select id="clientFilter" class="filter-select"><option value="">Todos os clientes</option>${clients.map(c=>`<option>${c.name}</option>`).join('')}</select><select id="deadlineFilter" class="filter-select"><option value="">Todos os prazos</option><option value="late">Atrasados</option><option value="near">Hoje e amanhã</option><option value="week">Esta semana</option></select></div><div class="table-wrap"><table class="page-table"><thead><tr><th>Cliente</th><th>Conteúdo</th><th>Enviado</th><th>Prazo</th><th>Status</th><th>Próxima ação</th><th>Ações</th></tr></thead><tbody id="approvalPageBody"></tbody></table></div></section>`;
      const update=()=>{const q=document.getElementById('approvalSearch').value.toLowerCase(),s=document.getElementById('statusFilter').value,c=document.getElementById('clientFilter').value,d=document.getElementById('deadlineFilter').value;const found=approvals.filter(a=>(!q||`${a.client} ${a.content}`.toLowerCase().includes(q))&&(!s||a.status===s)&&(!c||a.client===c)&&(!d||(d==='late'&&a.late)||(d==='near'&&['Hoje','Amanhã'].includes(a.deadline))||(d==='week'&&!a.late)));document.getElementById('approvalPageBody').innerHTML=approvalRows(found)||'<tr><td colspan="7" class="next-action">Nenhuma aprovação encontrada.</td></tr>';};['approvalSearch','statusFilter','clientFilter','deadlineFilter'].forEach(id=>document.getElementById(id).addEventListener('input',update));update();

    function renderClients(){dynamicContent.innerHTML=`<section class="client-grid">${clients.map(c=>`<button class="client-card" data-client="${c.name}"><div class="client-card-top"><div class="company-dot">${c.initials}</div><div><h3>${c.name}</h3><div class="company">${c.company}</div></div></div><div class="client-meta"><span>${c.whatsapp}</span><span>${c.email}</span></div><div class="client-card-foot"><span><b class="pending-count">${c.pending}</b> pendente${c.pending===1?'':'s'}</span><span class="badge ${c.cls}">${c.state}</span></div></button>`).join('')}</section>`;}
    function renderClientDetails(name){const c=clients.find(item=>item.name===name),records=approvals.filter(a=>a.client===name),past=history.filter(a=>a.client===name);dynamicContent.innerHTML=`<button class="back-link" data-back-clients>← Voltar para clientes</button><section class="detail-layout"><aside class="detail-card"><div class="company-dot">${c.initials}</div><h2>${c.name}</h2><p>${c.company}</p><div class="detail-list"><div><b>WhatsApp</b>${c.whatsapp}</div><div><b>E-mail</b>${c.email}</div><div><b>Última interação</b>${c.last}</div></div><button class="primary" data-action="WhatsApp">Abrir WhatsApp</button></aside><div><section class="sub-card"><div class="detail-heading"><h3>Aprovações atuais</h3><span class="badge ${c.cls}">${c.pending} pendente${c.pending===1?'':'s'}</span></div><div class="table-wrap"><table class="page-table"><thead><tr><th>Conteúdo</th><th>Enviado</th><th>Prazo</th><th>Status</th></tr></thead><tbody>${records.map(a=>`<tr><td><div class="content-title">${a.content}</div><div class="content-type">${a.type}</div></td><td class="date-cell">${a.sent}</td><td class="deadline ${a.late?'late':''}">${a.deadline}</td><td>${badge(a)}</td></tr>`).join('')||'<tr><td colspan="4" class="next-action">Sem aprovações em andamento.</td></tr>'}</tbody></table></div></section><section class="sub-card"><div class="detail-heading"><h3>Últimos contatos</h3></div><div class="timeline"><div class="timeline-item"><b>${c.last} · Equipe LUMADS</b>Última interação registrada para este cliente.</div><div class="timeline-item"><b>25 ago · PodePostar</b>Link de aprovação enviado ao responsável.</div><div class="timeline-item"><b>22 ago · Fluxo iniciado</b>Acompanhamento de conteúdo criado.</div></div></section><section class="sub-card"><div class="detail-heading"><h3>Histórico de aprovações</h3></div><div class="timeline">${past.length?past.map(h=>`<div class="timeline-item"><b>${h.content} · ${h.status}</b>Finalizado em ${h.finish} após ${h.reminders} lembrete${h.reminders==='1'?'':'s'}.</div>`).join(''):'<div class="timeline-item"><b>Sem histórico recente</b>As novas aprovações aparecerão aqui.</div>'}</div></section></div></section>`;}
    function renderHistory(){dynamicContent.innerHTML=`<section class="history-kpi"><div class="metric"><div class="metric-label">Finalizadas no mês</div><div class="metric-line"><strong class="metric-value">38</strong><span class="mini blue">✓</span></div></div><div class="metric"><div class="metric-label">Tempo médio de aprovação</div><div class="metric-line"><strong class="metric-value">1,8d</strong><span class="mini violet">◷</span></div></div><div class="metric"><div class="metric-label">Aprovadas sem lembrete</div><div class="metric-line"><strong class="metric-value">61%</strong><span class="mini mint">↑</span></div></div></section><section class="page-section"><div class="page-intro"><div><h2>Histórico de aprovações</h2><p>Conteúdos concluídos e publicados.</p></div></div><div class="filter-panel"><select id="historyClient" class="filter-select"><option value="">Todos os clientes</option>${clients.map(c=>`<option>${c.name}</option>`).join('')}</select><select id="historyPeriod" class="filter-select"><option value="">Todo o período</option><option value="ago">Agosto de 2026</option><option value="jul">Julho de 2026</option></select><select id="historyStatus" class="filter-select"><option value="">Todos os status</option><option>Aprovado</option><option>Publicado</option></select></div><div class="table-wrap"><table class="page-table"><thead><tr><th>Cliente</th><th>Conteúdo</th><th>Data de início</th><th>Data de aprovação</th><th>Lembretes</th><th>Status final</th></tr></thead><tbody id="historyBody"></tbody></table></div></section>`;const update=()=>{const c=document.getElementById('historyClient').value,s=document.getElementById('historyStatus').value,p=document.getElementById('historyPeriod').value;const found=history.filter(h=>(!c||h.client===c)&&(!s||h.status===s)&&(!p||h.finish.toLowerCase().includes(p)));document.getElementById('historyBody').innerHTML=found.map(h=>`<tr><td>${clientCell({...h,company:clients.find(c=>c.name===h.client)?.company})}</td><td     function renderSettings(){const settings=[['AG','Dados da agência','Informações da LUMADS usadas nos fluxos de acompanhamento.','Editar dados'],['US','Usuários','Pessoas da equipe que podem acompanhar aprovações.','Gerenciar usuários'],['MQ','Mensagens rápidas','Modelos de lembrete e confirmação para revisão futura.','Ver mensagens'],['PD','Prazos padrão','Defina o prazo recomendado para cada aprovação.','Editar prazos'],['WA','WhatsApp','Integração disponível em uma próxima etapa do produto.','Em breve'],['EM','E-mail','Configurações de envio serão conectadas futuramente.','Em breve']];dynamicContent.innerHTML=`<section class="settings-grid">${settings.map((s,i)=>`<article class="setting-card"><div class="setting-icon">${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p>${i>3?'<span class="future">CONFIGURAÇÃO FUTURA</span>':`<button class="back-link" data-action="${s[3]}">${s[3]} →</button>`}</article>`).join('')}</section>`;}
    function navigate(page){document.querySelectorAll('.nav-item').forEach(btn=>btn.classList.toggle('active',btn.dataset.page===page));headerFor(page);dashboardContent.hidden=page!=='Dashboard';dynamicContent.hidden=page==='Dashboard';if(page==='Dashboard'){dynamicContent.innerHTML='';renderTable()}if(page==='Aprovações')renderApprovals();if(page==='Clientes')renderClients();if(page==='Histórico')renderHistory();if(page==='Configurações')renderSettings();window.scrollTo({top:0,behavior:'smooth'});}
